services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:?Set DB_NAME in deploy/.env}
      MYSQL_USER: ${DB_USER:?Set DB_USER in deploy/.env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in deploy/.env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in deploy/.env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--protocol=tcp", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: eighty-point-huai-an/server:local
    build:
      context: ../server
      dockerfile: Dockerfile
    command: ["migrate"]
    restart: "no"
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:?Set DB_NAME in deploy/.env}
      DB_USER: ${DB_USER:?Set DB_USER in deploy/.env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in deploy/.env}
    depends_on:
      mysql:
        condition: service_healthy

  server:
    image: eighty-point-huai-an/server:local
    build:
      context: ../server
      dockerfile: Dockerfile
    command: ["serve"]
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":8080"
      HEALTHCHECK_URL: http://127.0.0.1:8080/healthz
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/server", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  mysql_data:
  redis_data:
