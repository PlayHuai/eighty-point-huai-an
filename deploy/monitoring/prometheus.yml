global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 127.0.0.1:9093

scrape_configs:
  - job_name: eighty-point-health
    metrics_path: /healthz
    static_configs:
      - targets:
          - 127.0.0.1:8080
