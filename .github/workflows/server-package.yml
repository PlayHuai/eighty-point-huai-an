name: Server package

on:
  push:
    branches:
      - master
    paths:
      - "server/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4.2.2

      - name: Set up Go
        uses: actions/setup-go@v5.5.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.mod

      - name: Test server
        working-directory: server
        run: go test ./...

      - name: Build Linux server image
        env:
          IMAGE_TAG: eighty-point-huai-an-server:${{ github.sha }}
        run: |
          docker build --platform linux/amd64 \
            --file server/Dockerfile \
            --tag "$IMAGE_TAG" \
            server
          mkdir -p server/build
          docker save "$IMAGE_TAG" --output server/build/server-linux-amd64.tar

      - name: Upload server package
        uses: actions/upload-artifact@v4.6.2
        with:
          name: server-linux-amd64-${{ github.sha }}
          path: server/build/server-linux-amd64.tar
          if-no-files-found: error
