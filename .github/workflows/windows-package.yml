name: Windows client package

on:
  push:
    branches:
      - master
    paths:
      - "client/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, windows, x64]
    steps:
      - name: Check out source
        uses: actions/checkout@v4.2.2

      - name: Verify Flutter SDK
        shell: pwsh
        run: |
          $version = (flutter --version | Select-Object -First 1)
          if ($version -notmatch '^Flutter 3\.47\.8') {
            throw "Expected Flutter 3.47.8, got: $version"
          }
          dart --version

      - name: Install dependencies
        working-directory: client
        run: flutter pub get

      - name: Build Windows client
        working-directory: client
        run: flutter build windows --release

      - name: Package Windows client as MSIX
        working-directory: client
        run: dart run msix:create --build-windows false --install-certificate false

      - name: Upload Windows package
        uses: actions/upload-artifact@v4.6.2
        with:
          name: windows-x64-${{ github.sha }}
          path: client/build/windows/**/*.msix
          if-no-files-found: error
