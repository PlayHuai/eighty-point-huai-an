name: eighty_point_huai_an
description: Shared Flutter client for 淮安80分.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.8"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  flutter_secure_storage: ^10.0.0
  flutter_svg: ^2.2.3
  fixnum: ^1.1.1
  grpc: ^5.1.0
  protobuf: ^6.1.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  # Riverpod generator 4 requires build 4; build_runner 2.17 uses build 5.
  build_runner: ">=2.16.2 <2.17.0"
  flutter_test:
    sdk: flutter
  riverpod_generator: ^4.0.9

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter.ttf
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC/NotoSansSC.ttf
  assets:
    - assets/fonts/Inter/OFL.txt
    - assets/fonts/NotoSansSC/OFL.txt
    - assets/app_icon.png
    - ../ui-design/asserts/ic_lighter/lighter.png
